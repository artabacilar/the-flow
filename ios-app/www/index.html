<!doctype html>
<meta charset="utf-8">
<title>The Flow</title>
<!-- Capacitor insists on a local web directory even when the app loads from a
     server. This file is the fallback shown only if that server cannot be
     reached at launch, so it says the one useful thing and nothing else. -->
<style>
  html,body{height:100%;margin:0;background:#0a0b0d;color:#e8eef7;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:grid;place-items:center;text-align:center;padding:24px}
  p{color:#8b97a8;max-width:22rem;margin:8px 0 0}
</style>
<div>
  <strong>The Flow can’t reach the server</strong>
  <p>Check your connection and reopen the app. Nothing you have saved is lost — it all lives on the server.</p>
</div>
